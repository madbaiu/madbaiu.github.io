<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homelab Dashboard - Bayu Mahardika</title>
  <meta name="theme-color" content="#0a0c10">
  <link rel="icon" type="image/png" href="images/favi.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a href="index.html" class="brand"><span class="dot"></span>bayu.</a>
      <nav aria-label="Primary">
        <ul>
          <li><a href="index.html"><i class="fa fa-arrow-left"></i> Back to portfolio</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="page-head">
      <div class="row">
        <div>
          <p class="eyebrow">// homelab</p>
          <h1 class="title" style="font-size:clamp(2rem,5vw,3rem);letter-spacing:-0.03em;line-height:1.1;margin-bottom:.6rem">Homelab Dashboard</h1>
          <p class="sub">Live status of my self-hosted services. Click a card to open it.</p>
        </div>
        <div class="summary" id="summary" role="status"><span class="led"></span><span id="summaryText">Checking services…</span></div>
      </div>
    </div>

    <div class="services" id="services"></div>
  </main>

  <script>
    var DOMAIN = "baiu.online";
    var SERVICES = [
      { name: "CasaOS",       sub: "Server OS & app manager", host: "casa",    icon: "casaos.svg" },
      { name: "Nextcloud",    sub: "Files & sync",            host: "nc",      icon: "nextcloud.svg" },
      { name: "Jellyfin",     sub: "Media server",            host: "jelly",   icon: "jellyfin.svg" },
      { name: "Immich",       sub: "Photo library",           host: "gallery", icon: "immich.svg" },
      { name: "IT Tools",     sub: "Tools for everyone",      host: "tools",   icon: "it-tools.svg" },
      { name: "n8n",          sub: "Workflow automation",     host: "n8n",     icon: "n8n.svg" },
      { name: "Beszel",       sub: "Server monitoring",       host: "beszel",  icon: "beszel.svg" },
      { name: "Pi-hole",      sub: "Network-wide DNS filter", host: "pihole",  icon: "pihole.svg" },
      { name: "Vaultwarden",  sub: "If you know, you know",   host: "vault",   icon: "vaultwarden.svg" },
      { name: "Uptime Kuma",  sub: "Uptime monitoring",       host: "kuma",    icon: "kuma.svg" },
      { name: "MySpeed",      sub: "Internet speed tests",    host: "speed",   icon: "myspeed.svg" },
      { name: "Repository",   sub: "Package mirror",          host: "repo",    icon: "network.svg" },
      { name: "qBittorrent",  sub: "Download client",         host: "torrent", icon: "qbittorrent.svg" },
      { name: "Radarr",       sub: "Movie management",        host: "radarr",  icon: "radarr.svg" },
      { name: "Sonarr",       sub: "TV management",           host: "sonarr",  icon: "sonarr.svg" },
      { name: "Bazarr",       sub: "Subtitle management",     host: "bazarr",  icon: "bazarr.svg" },
      { name: "OSKT",         sub: "Self-hosted app",         host: "oskt",    icon: "ost.svg" }
    ];

    var grid = document.getElementById("services");
    var summary = document.getElementById("summary");
    var summaryText = document.getElementById("summaryText");
    var state = {};

    SERVICES.forEach(function (s) {
      var url = "https://" + s.host + "." + DOMAIN;
      var a = document.createElement("a");
      a.className = "service";
      a.href = url; a.target = "_blank"; a.rel = "noopener";
      a.innerHTML =
        '<div class="ico"><img src="images/' + s.icon + '" alt="" loading="lazy"></div>' +
        '<div><h3>' + s.name + '</h3><small>' + s.sub + '</small>' +
        '<span class="status checking">Checking…</span></div>';
      grid.appendChild(a);
      s.el = a.querySelector(".status");
      s.url = url;
    });

    function render() {
      var total = SERVICES.length, up = 0, done = 0;
      SERVICES.forEach(function (s) {
        if (state[s.host] !== undefined) done++;
        if (state[s.host] === true) up++;
      });
      if (done < total) { summaryText.textContent = "Checking services…"; return; }
      summaryText.textContent = up + " / " + total + " services online";
      summary.className = "summary " + (up === total ? "good" : "warn");
    }

    // With mode:"no-cors" the response is opaque, so this reliably detects
    // "reachable vs. not reachable" (DNS/tunnel/network failure), not HTTP status.
    function check(s) {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 6000);
      var t0 = performance.now();
      fetch(s.url, { mode: "no-cors", cache: "no-store", signal: ctrl.signal })
        .then(function () {
          var ms = Math.round(performance.now() - t0);
          s.el.className = "status online";
          s.el.textContent = "Online · " + ms + " ms";
          state[s.host] = true;
        })
        .catch(function () {
          s.el.className = "status offline";
          s.el.textContent = "Offline";
          state[s.host] = false;
        })
        .finally(function () { clearTimeout(timer); render(); });
    }

    function checkAll() { SERVICES.forEach(check); }
    checkAll();
    setInterval(checkAll, 30000);
  </script>
</body>
</html>
