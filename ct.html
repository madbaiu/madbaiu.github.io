<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayu & Qeysa</title>
<meta name="theme-color" content="#07100d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="love.css">
</head>
<body>

<main class="page center">
  <div class="card fade">
    <span class="badge">💍 Married on 17 May 2026</span>
    <h1><span class="grad">Bayu &amp; Qeysa</span></h1>
    <p class="note">Together since the day we said “I do”</p>

    <p class="label">Our time together</p>
    <div class="tiles" aria-live="off">
      <div class="tile"><b data-love="months">0</b><span>months</span></div>
      <div class="tile"><b data-love="days">0</b><span>days</span></div>
      <div class="tile"><b data-love="hours">00</b><span>hours</span></div>
      <div class="tile"><b data-love="minutes">00</b><span>min</span></div>
      <div class="tile"><b data-love="seconds">00</b><span>sec</span></div>
    </div>
    <p class="note"><span data-love="totalDays">0</span> days of being married 💚</p>

    <p class="label">Road to our <span data-love="annivYear">1st</span> anniversary</p>
    <div class="bar"><i data-love-bar></i></div>
    <p class="note" style="margin-top:.5rem"><span data-love="annivLeft">0</span> days to go</p>

    <p class="msg" id="msg"></p>

    <footer>Made with love — Bayuu, <b>(cuamiii muuu)</b> 💚</footer>
  </div>
</main>

<script src="love.js"></script>
<script>
  Love.floaters();
  Love.startCounter();
  Love.rotate(document.getElementById("msg"), [
    "Every day with you feels like home 💚",
    "Married, and still falling for you.",
    "Built with love, patience, and a little chaos.",
    "You + Me = Home",
    "This is just the beginning."
  ]);
</script>
</body>
</html>
