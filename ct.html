<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayu & Qeysa - Our Days</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(135deg, #6B8E6E, #A8C3A0);
    color: #2f3e2f;

    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    text-align: center;
    padding: 1rem;
    overflow: hidden;
}

/* FLOATING LEAVES */
.leaf {
    position: absolute;
    width: 20px;
    height: 20px;
    background: rgba(255,255,255,0.3);
    border-radius: 50% 0 50% 50%;
    transform: rotate(45deg);
    animation: float 10s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
    20% { opacity: .6; }
    100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; }
}

.container {
    width: min(480px, 100%);
    padding: 1.6rem;
    border-radius: 18px;

    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.4);
}

h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    margin-bottom: .3rem;
}

.names {
    font-size: 1.1rem;
    color: #4f6b4f;
    margin-bottom: 1rem;
}

.target {
    margin-bottom: 1.2rem;
    font-size: .95rem;
    color: #3f5a3f;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: .6rem;
    margin-bottom: 1rem;
}

.tile {
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 12px;

    padding: .8rem .3rem;
    min-height: 80px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.value {
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    font-weight: 700;
}

.label {
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-top: .2rem;
    color: #4f6b4f;
}

.total {
    font-size: .9rem;
    color: #3f5a3f;
    margin-top: .4rem;
}

.message {
    font-size: 0.95rem;
    margin-top: .8rem;
    color: #5a3f22;
    min-height: 1.5em;
    transition: opacity .5s;
}

.footer {
    margin-top: 1.2rem;
    font-size: 0.85rem;
    color: #3f5a3f;
    line-height: 1.4;
}

.footer .cute {
    color: #2f3e2f;
    font-weight: 500;
}

@media (max-width: 420px) {
    .countdown { grid-template-columns: repeat(3, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
    .leaf { animation: none; display: none; }
}
</style>
</head>

<body>

<!-- LEAVES -->
<div class="leaf" style="left:10%; animation-delay:0s;"></div>
<div class="leaf" style="left:30%; animation-delay:3s;"></div>
<div class="leaf" style="left:60%; animation-delay:6s;"></div>
<div class="leaf" style="left:80%; animation-delay:1.5s;"></div>

<main class="container">
    <h1>💍 Together Since 💍</h1>
    <div class="names">Bayu & Qeysa</div>
    <p class="target">Married on 17 May 2026</p>

    <div class="countdown">
        <div class="tile"><span class="value" id="months">0</span><span class="label">months</span></div>
        <div class="tile"><span class="value" id="days">0</span><span class="label">days</span></div>
        <div class="tile"><span class="value" id="hours">00</span><span class="label">hours</span></div>
        <div class="tile"><span class="value" id="minutes">00</span><span class="label">minutes</span></div>
        <div class="tile"><span class="value" id="seconds">00</span><span class="label">seconds</span></div>
    </div>

    <p class="total" id="total"></p>
    <p class="message" id="message"></p>

    <footer class="footer">
        Made with love — Bayuu, <span class="cute">(cuamiii muuu) 💚</span>
    </footer>

</main>

<script>
// Wedding moment, fixed to WITA (UTC+8) so it is the same for every viewer
const START = new Date("2026-05-17T00:00:00+08:00");
const SHIFT = 8 * 60 * 60 * 1000; // read calendar parts in WITA

const el = id => document.getElementById(id);
const messageEl = el("message");

const messages = [
    "Every day with you feels like home 💚",
    "Married, and still falling for you.",
    "Built with love, patience, and a little chaos.",
    "You + Me = Home",
    "This is just the beginning.",
];

let msgIndex = 0;

function rotateMessage() {
    messageEl.style.opacity = 0;
    setTimeout(() => {
        messageEl.textContent = messages[msgIndex];
        messageEl.style.opacity = 1;
        msgIndex = (msgIndex + 1) % messages.length;
    }, 400);
}

setInterval(rotateMessage, 4000);
rotateMessage();

/* Calendar-aware elapsed time since the wedding */
function elapsed(from, to) {
    const a = new Date(from.getTime() + SHIFT);
    const b = new Date(to.getTime() + SHIFT);

    let months = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth());
    // anchor = the wedding moment shifted forward by whole months
    let anchor = new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth() + months, a.getUTCDate(),
        a.getUTCHours(), a.getUTCMinutes(), a.getUTCSeconds()));
    if (anchor > b) {
        months -= 1;
        anchor = new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth() + months, a.getUTCDate(),
            a.getUTCHours(), a.getUTCMinutes(), a.getUTCSeconds()));
    }
    let rest = Math.floor((b - anchor) / 1000);
    const days = Math.floor(rest / 86400); rest -= days * 86400;
    const hours = Math.floor(rest / 3600); rest -= hours * 3600;
    const minutes = Math.floor(rest / 60);
    const seconds = rest - minutes * 60;
    return { months, days, hours, minutes, seconds };
}

function update() {
    const now = new Date();

    if (now < START) {
        // Not reached yet (safety): show nothing negative
        ["months","days"].forEach(k => el(k).textContent = "0");
        ["hours","minutes","seconds"].forEach(k => el(k).textContent = "00");
        el("total").textContent = "";
        return;
    }

    const t = elapsed(START, now);
    el("months").textContent = t.months;
    el("days").textContent = t.days;
    el("hours").textContent = String(t.hours).padStart(2, "0");
    el("minutes").textContent = String(t.minutes).padStart(2, "0");
    el("seconds").textContent = String(t.seconds).padStart(2, "0");

    const totalDays = Math.floor((now - START) / 86400000);
    el("total").textContent = totalDays + " days of being married 💚";
}

update();
setInterval(update, 1000);
</script>

</body>
</html>
